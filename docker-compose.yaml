services:
  postgres:
    image: postgres:16
    container_name: ride-postgres
    environment:
      POSTGRES_DB: ridedb
      POSTGRES_USER: kuchupuchu
      POSTGRES_PASSWORD: mycutiepie
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ride-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres:
  pgadmin:
